# Local smoke run at SF1 on a 20-core development machine.
run_id: smoke-sf1
sf: 1
systems:
  - innodb          # row-store baselines first: they gate the run (see README)
  - postgres
  - duckdb-1.5.5    # plain DuckDB, also the reference
  - duckdb-1.4.3
  - alisql
  - mariadb
  - percona
  - pg_duckdb
  - pg_ducklake
measures: [M1, M2, M3]
limits:
  db_cpuset: "0-7"
  runner_cpuset: "8-11"
  mem_gb: 16
timeout_s: 900
reference:
  system: duckdb-1.5.5
  cross_check: [duckdb-1.4.3]   # used at SF100 and above
track_b:
  enabled: true
  systems: [duckdb-1.5.5, villagesql, pg_duckdb-trackb, mariadb-trackb]
