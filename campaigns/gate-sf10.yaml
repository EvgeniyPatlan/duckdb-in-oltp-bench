# Week-1 correctness gate at SF10 on the 80-core bench host.
run_id: gate-sf10
sf: 10
systems:
  - innodb          # row-store baselines first: they gate the run (see README)
  - postgres
  - duckdb-1.5.5    # plain DuckDB, also the reference
  - duckdb-2.0.0    # newest DuckDB release
  - duckdb-1.4.3
  - duckdb-1.5.3        # M7: the DuckDB inside pg_ducklake
  - duckdb-1.5.2-dev736 # M7: the DuckDB inside AliSQL
  - alisql
  - mariadb
  - percona
  - pg_duckdb
  - pg_ducklake
measures: [M1, M2, M3, M4, M5, M8]
limits:
  db_cpuset: "0-15"
  runner_cpuset: "16-23"
  mem_gb: 64
timeout_s: 900
reference:
  system: duckdb-1.5.5
  cross_check: [duckdb-1.4.3]   # used at SF100 and above
overrides:
  # Row-store baselines: no M4 (hours of concurrent streams on a row store tell nothing)
  # and no M8; M5 stays because it builds the probe reference for each dialect.
  innodb: {measures: [M1, M2, M3, M5]}
  postgres: {measures: [M1, M2, M3, M5]}
  # Plain DuckDB at the versions bundled by integrations: M1 only, for the overhead ratio (M7).
  duckdb-1.5.3: {measures: [M1]}
  duckdb-1.5.2-dev736: {measures: [M1]}
track_b:
  enabled: true
  systems: [duckdb-1.5.5, villagesql, pg_duckdb-trackb, mariadb-trackb]
