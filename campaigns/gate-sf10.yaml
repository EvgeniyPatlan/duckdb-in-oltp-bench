# Week-1 correctness gate at SF10 on the 80-core bench host.
run_id: gate-sf10
sf: 10
systems:
  - innodb          # row-store baselines first: they gate the run (see README)
  - postgres
  - duckdb-1.5.5    # plain DuckDB, also the reference
  - duckdb-1.4.3
  - alisql
  - mariadb
  - percona
  - pg_duckdb
  - pg_ducklake
measures: [M1, M2, M3, M4]
limits:
  db_cpuset: "0-15"
  runner_cpuset: "16-23"
  mem_gb: 64
timeout_s: 900
reference:
  system: duckdb-1.5.5
  cross_check: [duckdb-1.4.3]   # used at SF100 and above
track_b:
  enabled: true
  systems: [duckdb-1.5.5, villagesql, pg_duckdb-trackb, mariadb-trackb]
