# pg_duckdb 1.1.1 (PostgreSQL 18). Rendered by dbench/systems/baseline_conf.py (jinja2) from the
# container limits and mounted read-only at /etc/postgresql/postgresql.conf.
# DuckDB scans ordinary Postgres heap pages, so shared_buffers keeps the Postgres baseline value.
# Sizing formulas (mem_gb = container memory, cores = CPUs in the DB cpuset):
#   shared_buffers       = 0.25 * mem_gb  (64 GB / 16 cores -> 16GB)
#   duckdb.max_memory    = 0.5 * mem_gb   (64 GB / 16 cores -> 32GB)
#   duckdb.threads       = cores          (16)
#   the rest equals the Postgres baseline (effective_cache_size 0.75 * mem_gb, ...).

# The runner container connects over the docker bridge.
listen_addresses = '*'
# The extension must be preloaded (the image adds this to the default file, which is replaced here).
shared_preload_libraries = 'pg_duckdb'
# 25% of container memory, as in the Postgres baseline: DuckDB reads heap pages through it.
shared_buffers = {{ shared_buffers }}
# Planner's estimate of buffer plus page cache: 75% of container memory.
effective_cache_size = {{ effective_cache_size }}
# Allow one query to use every core given to the database.
max_parallel_workers_per_gather = {{ workers }}
# Cap on parallel workers across all sessions: one per core.
max_parallel_workers = {{ workers }}
# Must be at least max_parallel_workers for those workers to start.
max_worker_processes = {{ workers }}
# Analytical sorts and hashes stay in memory instead of spilling at the 4MB default.
work_mem = 256MB
# Headroom for the 32-stream throughput run plus probes and cancel connections.
max_connections = 200
# WAL of mem_gb/4 keeps checkpoints from throttling bulk load at the 1GB default.
max_wal_size = {{ max_wal_size }}
# Timed checkpoints every 30 minutes, so load and query runs are not interrupted by them.
checkpoint_timeout = 30min
# DuckDB memory limit: half of container memory, leaving the rest for shared_buffers and page cache.
duckdb.max_memory = {{ duck_memory }}
# DuckDB worker threads: one per core in the DB cpuset (default -1 lets DuckDB pick).
duckdb.threads = {{ duck_threads }}
# DuckDB spill directory, explicit and on the data volume (the default is also under PGDATA).
duckdb.temporary_directory = '{{ spill_dir }}'
