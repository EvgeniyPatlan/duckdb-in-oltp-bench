[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dbench"
version = "0.1.0"
description = "Reproducible benchmark of DuckDB integrations in MySQL, MariaDB and PostgreSQL servers"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "docker",
    "pymysql",
    "psycopg[binary]",
    "pyyaml",
    "jinja2",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
dbench = "dbench.cli:main"

[tool.setuptools]
packages = ["dbench", "dbench.queries"]

[tool.setuptools.package-data]
"dbench.queries" = ["tpch/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
