      - "INSERT INTO pc_var_session_time_zone VALUES (1, '2024-02-29 13:45:10'), (2, '2000-01-01 00:00:00')"
    teardown:
      - "DROP TABLE IF EXISTS pc_var_session_time_zone"
    sql_mysql:
