    sql_postgres: "WITH cnt AS (SELECT id, COUNT(*) AS c FROM pc_cte_multiple_b GROUP BY id), big AS (SELECT id FROM cnt WHERE c > 1) SELECT pc_cte_multiple_a.id, v FROM pc_cte_multiple_a JOIN big ON big.id = pc_cte_multiple_a.id"
