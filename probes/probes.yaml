    sql_postgres: "WITH j AS (SELECT pc_cte_plain_a.id, w FROM pc_cte_plain_a JOIN pc_cte_plain_b ON pc_cte_plain_a.id = pc_cte_plain_b.id) SELECT id, w FROM j WHERE w <> 'b3'"
