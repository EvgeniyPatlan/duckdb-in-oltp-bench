# SQL compatibility probes (M5).
#
# The suite is fixed before any results are seen. A probe is changed afterwards only when its
# two dialects turn out not to express the same intent, or when the row-store baseline's own
# result is invalid; never to improve or worsen any engine's outcome.
#
# Each probe is one statement (or one session script) a user of an OLTP database would naturally
# try. Fields:
#   id, category, title   unique id (lowercase, digits, underscores), one of types, functions,
#                         joins, subqueries, cte, window, dml, ddl, variables, and a one-line intent
#   setup / teardown      list of statements, or {mysql: [...], postgres: [...]}. Probes use their
#                         own scratch tables (pc_*): {{ engine_clause }} renders to the system's
#                         engine (ENGINE=DuckDB, USING ducklake, or nothing), {{ rowstore_clause }}
#                         to a plain row-store table (ENGINE=InnoDB, or nothing for a Postgres heap).
#   sql_mysql / sql_postgres  the statement; a list is one session, the last statement is the probe
#   check_mysql / check_postgres  follow-up SELECT, required for dml and ddl probes
#   expected              optional literal rows; without it the result of the same-dialect row-store
#                         baseline (InnoDB / Postgres) is the expectation
#   note                  why a dialect is spelled differently
#
# Probes that read a table always read at least one row, so a status counter can tell whether
# DuckDB ran them. Only the TPC-H tables nation, region and supplier are read (never written).

probes:
  - id: types_int
    category: types
    title: "INT round trip including both limits"
    setup:
      mysql:
        - "CREATE TABLE pc_types_int (id INT, v INT) {{ engine_clause }}"
        - "INSERT INTO pc_types_int VALUES (1, -2147483648), (2, 0), (3, 2147483647), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_int (id INT, v INT) {{ engine_clause }}"
        - "INSERT INTO pc_types_int VALUES (1, -2147483648), (2, 0), (3, 2147483647), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_int"
    sql_mysql: "SELECT id, v FROM pc_types_int"
    sql_postgres: "SELECT id, v FROM pc_types_int"
  - id: types_bigint
    category: types
    title: "BIGINT round trip near both limits"
    setup:
      mysql:
        - "CREATE TABLE pc_types_bigint (id INT, v BIGINT) {{ engine_clause }}"
        - "INSERT INTO pc_types_bigint VALUES (1, -9223372036854775807), (2, 0), (3, 9223372036854775807), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_bigint (id INT, v BIGINT) {{ engine_clause }}"
        - "INSERT INTO pc_types_bigint VALUES (1, -9223372036854775807), (2, 0), (3, 9223372036854775807), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_bigint"
    sql_mysql: "SELECT id, v FROM pc_types_bigint"
    sql_postgres: "SELECT id, v FROM pc_types_bigint"
  - id: types_unsigned_bigint
    category: types
    title: "Unsigned 64-bit integer above the signed range (NUMERIC(20,0) on PostgreSQL)"
    setup:
      mysql:
        - "CREATE TABLE pc_types_unsigned_bigint (id INT, v BIGINT UNSIGNED) {{ engine_clause }}"
        - "INSERT INTO pc_types_unsigned_bigint VALUES (1, 0), (2, 9223372036854775808), (3, 18446744073709551615), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_unsigned_bigint (id INT, v NUMERIC(20,0)) {{ engine_clause }}"
        - "INSERT INTO pc_types_unsigned_bigint VALUES (1, 0), (2, 9223372036854775808), (3, 18446744073709551615), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_unsigned_bigint"
    sql_mysql: "SELECT id, v FROM pc_types_unsigned_bigint"
    sql_postgres: "SELECT id, v FROM pc_types_unsigned_bigint"
  - id: types_decimal_money
    category: types
    title: "DECIMAL(10,2) values with sign and zero"
    setup:
      mysql:
        - "CREATE TABLE pc_types_decimal_money (id INT, v DECIMAL(10,2)) {{ engine_clause }}"
        - "INSERT INTO pc_types_decimal_money VALUES (1, 12345678.90), (2, -0.01), (3, 0.00), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_decimal_money (id INT, v DECIMAL(10,2)) {{ engine_clause }}"
        - "INSERT INTO pc_types_decimal_money VALUES (1, 12345678.90), (2, -0.01), (3, 0.00), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_decimal_money"
    sql_mysql: "SELECT id, v FROM pc_types_decimal_money"
    sql_postgres: "SELECT id, v FROM pc_types_decimal_money"
  - id: types_decimal_wide
    category: types
    title: "DECIMAL(38,10) beyond double precision, compared as text too"
    setup:
      mysql:
        - "CREATE TABLE pc_types_decimal_wide (id INT, v DECIMAL(38,10)) {{ engine_clause }}"
        - "INSERT INTO pc_types_decimal_wide VALUES (1, 12345678901234567890.1234567891), (2, -0.0000000001), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_decimal_wide (id INT, v DECIMAL(38,10)) {{ engine_clause }}"
        - "INSERT INTO pc_types_decimal_wide VALUES (1, 12345678901234567890.1234567891), (2, -0.0000000001), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_decimal_wide"
    sql_mysql: "SELECT id, v, CAST(v AS CHAR(50)) FROM pc_types_decimal_wide"
    sql_postgres: "SELECT id, v, CAST(v AS VARCHAR(50)) FROM pc_types_decimal_wide"
  - id: types_float
    category: types
    title: "Single-precision float with exactly representable values"
    setup:
      mysql:
        - "CREATE TABLE pc_types_float (id INT, v FLOAT) {{ engine_clause }}"
        - "INSERT INTO pc_types_float VALUES (1, 1.5), (2, -2.25), (3, 1024), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_float (id INT, v REAL) {{ engine_clause }}"
        - "INSERT INTO pc_types_float VALUES (1, 1.5), (2, -2.25), (3, 1024), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_float"
    sql_mysql: "SELECT id, v FROM pc_types_float"
    sql_postgres: "SELECT id, v FROM pc_types_float"
  - id: types_double
    category: types
    title: "Double-precision float including extreme exponents"
    setup:
      mysql:
        - "CREATE TABLE pc_types_double (id INT, v DOUBLE) {{ engine_clause }}"
        - "INSERT INTO pc_types_double VALUES (1, 3.141592653589793), (2, 1e300), (3, -1e-300), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_double (id INT, v DOUBLE PRECISION) {{ engine_clause }}"
        - "INSERT INTO pc_types_double VALUES (1, 3.141592653589793), (2, 1e300), (3, -1e-300), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_double"
    sql_mysql: "SELECT id, v FROM pc_types_double"
    sql_postgres: "SELECT id, v FROM pc_types_double"
  - id: types_boolean
    category: types
    title: "BOOLEAN true, false and NULL read back as integers"
    setup:
      mysql:
        - "CREATE TABLE pc_types_boolean (id INT, v BOOLEAN) {{ engine_clause }}"
        - "INSERT INTO pc_types_boolean VALUES (1, TRUE), (2, FALSE), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_boolean (id INT, v BOOLEAN) {{ engine_clause }}"
        - "INSERT INTO pc_types_boolean VALUES (1, TRUE), (2, FALSE), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_boolean"
    sql_mysql: "SELECT id, v + 0 FROM pc_types_boolean"
    sql_postgres: "SELECT id, CAST(v AS INTEGER) FROM pc_types_boolean"
  - id: types_char_fixed
    category: types
    title: "CHAR(5) values shorter than, equal to and empty vs the width"
    setup:
      mysql:
        - "CREATE TABLE pc_types_char_fixed (id INT, v CHAR(5)) {{ engine_clause }}"
        - "INSERT INTO pc_types_char_fixed VALUES (1, 'ab'), (2, 'abcde'), (3, ''), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_char_fixed (id INT, v CHAR(5)) {{ engine_clause }}"
        - "INSERT INTO pc_types_char_fixed VALUES (1, 'ab'), (2, 'abcde'), (3, ''), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_char_fixed"
    sql_mysql: "SELECT id, v, LENGTH(v) FROM pc_types_char_fixed"
    sql_postgres: "SELECT id, v, LENGTH(v) FROM pc_types_char_fixed"
  - id: types_varchar_max
    category: types
    title: "VARCHAR(255) filled to its limit"
    setup:
      mysql:
        - "CREATE TABLE pc_types_varchar_max (id INT, v VARCHAR(255)) {{ engine_clause }}"
        - "INSERT INTO pc_types_varchar_max VALUES (1, REPEAT('x', 255)), (2, ''), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_varchar_max (id INT, v VARCHAR(255)) {{ engine_clause }}"
        - "INSERT INTO pc_types_varchar_max VALUES (1, REPEAT('x', 255)), (2, ''), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_varchar_max"
    sql_mysql: "SELECT id, LENGTH(v), SUBSTRING(v, 250, 6) FROM pc_types_varchar_max"
    sql_postgres: "SELECT id, LENGTH(v), SUBSTRING(v, 250, 6) FROM pc_types_varchar_max"
  - id: types_text_unicode
    category: types
    title: "TEXT with accents, CJK and an emoji"
    setup:
      mysql:
        - "CREATE TABLE pc_types_text_unicode (id INT, v TEXT) {{ engine_clause }}"
        - "INSERT INTO pc_types_text_unicode VALUES (1, 'héllo wörld'), (2, '日本語のテキスト'), (3, 'emoji 🙂 end'), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_text_unicode (id INT, v TEXT) {{ engine_clause }}"
        - "INSERT INTO pc_types_text_unicode VALUES (1, 'héllo wörld'), (2, '日本語のテキスト'), (3, 'emoji 🙂 end'), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_text_unicode"
    sql_mysql: "SELECT id, v, CHAR_LENGTH(v) FROM pc_types_text_unicode"
    sql_postgres: "SELECT id, v, CHAR_LENGTH(v) FROM pc_types_text_unicode"
  - id: types_date
    category: types
    title: "DATE across the supported range"
    setup:
      mysql:
        - "CREATE TABLE pc_types_date (id INT, v DATE) {{ engine_clause }}"
        - "INSERT INTO pc_types_date VALUES (1, '1970-01-01'), (2, '2024-02-29'), (3, '9999-12-31'), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_date (id INT, v DATE) {{ engine_clause }}"
        - "INSERT INTO pc_types_date VALUES (1, '1970-01-01'), (2, '2024-02-29'), (3, '9999-12-31'), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_date"
    sql_mysql: "SELECT id, v FROM pc_types_date"
    sql_postgres: "SELECT id, v FROM pc_types_date"
  - id: types_datetime
    category: types
    title: "DATETIME / TIMESTAMP without time zone"
    setup:
      mysql:
        - "CREATE TABLE pc_types_datetime (id INT, v DATETIME) {{ engine_clause }}"
        - "INSERT INTO pc_types_datetime VALUES (1, '2024-02-29 13:45:10'), (2, '1999-12-31 23:59:59'), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_datetime (id INT, v TIMESTAMP) {{ engine_clause }}"
        - "INSERT INTO pc_types_datetime VALUES (1, '2024-02-29 13:45:10'), (2, '1999-12-31 23:59:59'), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_datetime"
    sql_mysql: "SELECT id, v FROM pc_types_datetime"
    sql_postgres: "SELECT id, v FROM pc_types_datetime"
  - id: types_datetime_micro
    category: types
    title: "Timestamp with microsecond precision"
    setup:
      mysql:
        - "CREATE TABLE pc_types_datetime_micro (id INT, v DATETIME(6)) {{ engine_clause }}"
        - "INSERT INTO pc_types_datetime_micro VALUES (1, '2024-02-29 13:45:10.123456'), (2, '2000-01-01 00:00:00.000001'), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_datetime_micro (id INT, v TIMESTAMP(6)) {{ engine_clause }}"
        - "INSERT INTO pc_types_datetime_micro VALUES (1, '2024-02-29 13:45:10.123456'), (2, '2000-01-01 00:00:00.000001'), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_datetime_micro"
    sql_mysql: "SELECT id, v FROM pc_types_datetime_micro"
    sql_postgres: "SELECT id, v FROM pc_types_datetime_micro"
  - id: types_time
    category: types
    title: "TIME of day"
    setup:
      mysql:
        - "CREATE TABLE pc_types_time (id INT, v TIME) {{ engine_clause }}"
        - "INSERT INTO pc_types_time VALUES (1, '13:45:10'), (2, '23:59:59'), (3, '10:00:00'), (4, NULL)"
      postgres:
        - "CREATE TABLE pc_types_time (id INT, v TIME) {{ engine_clause }}"
        - "INSERT INTO pc_types_time VALUES (1, '13:45:10'), (2, '23:59:59'), (3, '10:00:00'), (4, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_time"
    sql_mysql: "SELECT id, v FROM pc_types_time"
    sql_postgres: "SELECT id, v FROM pc_types_time"
  - id: types_binary_blob
    category: types
    title: "BLOB / BYTEA bytes including NUL"
    setup:
      mysql:
        - "CREATE TABLE pc_types_binary_blob (id INT, v BLOB) {{ engine_clause }}"
        - "INSERT INTO pc_types_binary_blob VALUES (1, X'DEADBEEF'), (2, X'00FF00'), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_binary_blob (id INT, v BYTEA) {{ engine_clause }}"
        - "INSERT INTO pc_types_binary_blob VALUES (1, decode('DEADBEEF', 'hex')), (2, decode('00FF00', 'hex')), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_binary_blob"
    sql_mysql: "SELECT id, v, LENGTH(v) FROM pc_types_binary_blob"
    sql_postgres: "SELECT id, v, LENGTH(v) FROM pc_types_binary_blob"
  - id: types_json
    category: types
    title: "JSON document stored and one member extracted"
    setup:
      mysql:
        - "CREATE TABLE pc_types_json (id INT, v JSON) {{ engine_clause }}"
        - "INSERT INTO pc_types_json VALUES (1, '{\"a\": 1, \"b\": [1, 2, 3], \"c\": \"x\"}'), (2, '{\"a\": 2, \"b\": [], \"c\": \"y\"}'), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_json (id INT, v JSONB) {{ engine_clause }}"
        - "INSERT INTO pc_types_json VALUES (1, '{\"a\": 1, \"b\": [1, 2, 3], \"c\": \"x\"}'), (2, '{\"a\": 2, \"b\": [], \"c\": \"y\"}'), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_json"
    sql_mysql: "SELECT id, JSON_UNQUOTE(JSON_EXTRACT(v, '$.c')) FROM pc_types_json"
    sql_postgres: "SELECT id, v->>'c' FROM pc_types_json"
  - id: types_enum
    category: types
    title: "ENUM column grouped by value"
    setup:
      mysql:
        - "CREATE TABLE pc_types_enum (id INT, c ENUM('red', 'green', 'blue')) {{ engine_clause }}"
        - "INSERT INTO pc_types_enum VALUES (1, 'red'), (2, 'blue'), (3, 'red'), (4, NULL)"
      postgres:
        - "CREATE TYPE pc_types_enum_color AS ENUM ('red', 'green', 'blue')"
        - "CREATE TABLE pc_types_enum (id INT, c pc_types_enum_color) {{ engine_clause }}"
        - "INSERT INTO pc_types_enum VALUES (1, 'red'), (2, 'blue'), (3, 'red'), (4, NULL)"
    teardown:
      mysql:
        - "DROP TABLE IF EXISTS pc_types_enum"
      postgres:
        - "DROP TABLE IF EXISTS pc_types_enum"
        - "DROP TYPE IF EXISTS pc_types_enum_color"
    sql_mysql: "SELECT c, COUNT(*) FROM pc_types_enum GROUP BY c"
    sql_postgres: "SELECT CAST(c AS TEXT), COUNT(*) FROM pc_types_enum GROUP BY c"
    note: "PostgreSQL has no inline ENUM: it needs CREATE TYPE first."
  - id: types_uuid
    category: types
    title: "UUID values (CHAR(36) on MySQL, UUID on PostgreSQL)"
    setup:
      mysql:
        - "CREATE TABLE pc_types_uuid (id INT, u CHAR(36)) {{ engine_clause }}"
        - "INSERT INTO pc_types_uuid VALUES (1, '123e4567-e89b-12d3-a456-426614174000'), (2, '00000000-0000-0000-0000-000000000000'), (3, NULL)"
      postgres:
        - "CREATE TABLE pc_types_uuid (id INT, u UUID) {{ engine_clause }}"
        - "INSERT INTO pc_types_uuid VALUES (1, '123e4567-e89b-12d3-a456-426614174000'), (2, '00000000-0000-0000-0000-000000000000'), (3, NULL)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_uuid"
    sql_mysql: "SELECT id, u FROM pc_types_uuid"
    sql_postgres: "SELECT id, CAST(u AS TEXT) FROM pc_types_uuid"
  - id: types_all_null_row
    category: types
    title: "A row of NULLs in int, varchar, date and decimal columns"
    setup:
      - "CREATE TABLE pc_types_all_null (i INT, s VARCHAR(10), d DATE, n DECIMAL(8,2)) {{ engine_clause }}"
      - "INSERT INTO pc_types_all_null VALUES (NULL, NULL, NULL, NULL), (1, 'a', '2024-01-01', 1.50)"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_all_null"
    sql_mysql: "SELECT COUNT(*), COUNT(i), COUNT(s), COUNT(d), COUNT(n), SUM(n) FROM pc_types_all_null"
    sql_postgres: "SELECT COUNT(*), COUNT(i), COUNT(s), COUNT(d), COUNT(n), SUM(n) FROM pc_types_all_null"
  - id: types_long_text
    category: types
    title: "A 100000-character text value (LONGTEXT on MySQL, whose TEXT stops at 64 KB)"
    setup:
      mysql:
        - "CREATE TABLE pc_types_long_text (id INT, s LONGTEXT) {{ engine_clause }}"
        - "INSERT INTO pc_types_long_text VALUES (1, REPEAT('ab', 50000))"
      postgres:
        - "CREATE TABLE pc_types_long_text (id INT, s TEXT) {{ engine_clause }}"
        - "INSERT INTO pc_types_long_text VALUES (1, REPEAT('ab', 50000))"
    teardown:
      - "DROP TABLE IF EXISTS pc_types_long_text"
    sql_mysql: "SELECT LENGTH(s), SUBSTRING(s, 99999, 2) FROM pc_types_long_text"
    sql_postgres: "SELECT LENGTH(s), SUBSTRING(s, 99999, 2) FROM pc_types_long_text"
  - id: fn_concat
    category: functions
    title: "String concatenation, NULL propagates"
    setup:
      - "CREATE TABLE pc_fn_concat (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_concat VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_concat"
    sql_mysql: "SELECT id, CONCAT(s, '-x') FROM pc_fn_concat"
    sql_postgres: "SELECT id, s || '-x' FROM pc_fn_concat"
  - id: fn_upper_lower
    category: functions
    title: "UPPER and LOWER"
    setup:
      - "CREATE TABLE pc_fn_upper_lower (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_upper_lower VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_upper_lower"
    sql_mysql: "SELECT id, UPPER(s), LOWER(s) FROM pc_fn_upper_lower"
    sql_postgres: "SELECT id, UPPER(s), LOWER(s) FROM pc_fn_upper_lower"
  - id: fn_substring
    category: functions
    title: "SUBSTRING with start and length"
    setup:
      - "CREATE TABLE pc_fn_substring (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_substring VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_substring"
    sql_mysql: "SELECT id, SUBSTRING(s, 2, 3) FROM pc_fn_substring"
    sql_postgres: "SELECT id, SUBSTRING(s, 2, 3) FROM pc_fn_substring"
  - id: fn_trim_replace
    category: functions
    title: "TRIM and REPLACE"
    setup:
      - "CREATE TABLE pc_fn_trim_replace (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_trim_replace VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_trim_replace"
    sql_mysql: "SELECT id, TRIM(s), REPLACE(s, 'a', 'A') FROM pc_fn_trim_replace"
    sql_postgres: "SELECT id, TRIM(s), REPLACE(s, 'a', 'A') FROM pc_fn_trim_replace"
  - id: fn_like_lower
    category: functions
    title: "LOWER(s) LIKE pattern in WHERE"
    setup:
      - "CREATE TABLE pc_fn_like_lower (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_like_lower VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_like_lower"
    sql_mysql: "SELECT id FROM pc_fn_like_lower WHERE LOWER(s) LIKE '%a%a%'"
    sql_postgres: "SELECT id FROM pc_fn_like_lower WHERE LOWER(s) LIKE '%a%a%'"
  - id: fn_regexp
    category: functions
    title: "Case-sensitive regular expression in WHERE"
    setup:
      - "CREATE TABLE pc_fn_regexp (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_regexp VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_regexp"
    sql_mysql: "SELECT id FROM pc_fn_regexp WHERE REGEXP_LIKE(s, '^[a-z]+[0-9]+$', 'c')"
    sql_postgres: "SELECT id FROM pc_fn_regexp WHERE s ~ '^[a-z]+[0-9]+$'"
  - id: fn_lpad_cast
    category: functions
    title: "LPAD over a cast of an integer"
    setup:
      - "CREATE TABLE pc_fn_lpad_cast (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_lpad_cast VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_lpad_cast"
    sql_mysql: "SELECT id, LPAD(CAST(id AS CHAR), 5, '0') FROM pc_fn_lpad_cast"
    sql_postgres: "SELECT id, LPAD(CAST(id AS VARCHAR), 5, '0') FROM pc_fn_lpad_cast"
  - id: fn_nullif_coalesce
    category: functions
    title: "NULLIF and COALESCE"
    setup:
      - "CREATE TABLE pc_fn_nullif_coalesce (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_nullif_coalesce VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_nullif_coalesce"
    sql_mysql: "SELECT id, COALESCE(NULLIF(s, 'ab12'), 'none') FROM pc_fn_nullif_coalesce"
    sql_postgres: "SELECT id, COALESCE(NULLIF(s, 'ab12'), 'none') FROM pc_fn_nullif_coalesce"
  - id: fn_case_when
    category: functions
    title: "Searched CASE"
    setup:
      - "CREATE TABLE pc_fn_case_when (id INT, s VARCHAR(50)) {{ engine_clause }}"
      - "INSERT INTO pc_fn_case_when VALUES (1, 'Alpha'), (2, 'beta '), (3, NULL), (4, '  gamma delta'), (5, 'ab12')"
    teardown:
      - "DROP TABLE IF EXISTS pc_fn_case_when"
    sql_mysql: "SELECT id, CASE WHEN s IS NULL THEN 'null' WHEN CHAR_LENGTH(s) > 6 THEN 'long' ELSE 'short' END FROM pc_fn_case_when"
    sql_postgres: "SELECT id, CASE WHEN s IS NULL THEN 'null' WHEN CHAR_LENGTH(s) > 6 THEN 'long' ELSE 'short' END FROM pc_fn_case_when"
  - id: fn_cast_string_int
