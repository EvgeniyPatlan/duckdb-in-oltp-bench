      - "CREATE TABLE pc_cte_recursive_counter (id INT) {{ engine_clause }}"
      - "INSERT INTO pc_cte_recursive_counter VALUES (1)"
    teardown:
      - "DROP TABLE IF EXISTS pc_cte_recursive_counter"
    sql_mysql: "WITH RECURSIVE n(i) AS (SELECT MIN(id) FROM pc_cte_recursive_counter UNION ALL SELECT i + 1 FROM n WHERE i < 10) SELECT COUNT(*), SUM(i) FROM n"
    sql_postgres: "WITH RECURSIVE n(i) AS (SELECT MIN(id) FROM pc_cte_recursive_counter UNION ALL SELECT i + 1 FROM n WHERE i < 10) SELECT COUNT(*), SUM(i) FROM n"
  - id: cte_recursive_hierarchy
    category: cte
    title: "Recursive CTE walking a management tree with depth"
    setup:
      - "CREATE TABLE pc_cte_recursive_tree (id INT, mgr INT, name VARCHAR(20)) {{ engine_clause }}"
      - "INSERT INTO pc_cte_recursive_tree VALUES (1, NULL, 'root'), (2, 1, 'a'), (3, 1, 'b'), (4, 2, 'a1'), (5, 4, 'a1x'), (6, 3, 'b1')"
    teardown:
      - "DROP TABLE IF EXISTS pc_cte_recursive_tree"
    sql_mysql: "WITH RECURSIVE t(id, depth) AS (SELECT id, 0 FROM pc_cte_recursive_tree WHERE mgr IS NULL UNION ALL SELECT e.id, t.depth + 1 FROM pc_cte_recursive_tree e JOIN t ON e.mgr = t.id) SELECT id, depth FROM t"
    sql_postgres: "WITH RECURSIVE t(id, depth) AS (SELECT id, 0 FROM pc_cte_recursive_tree WHERE mgr IS NULL UNION ALL SELECT e.id, t.depth + 1 FROM pc_cte_recursive_tree e JOIN t ON e.mgr = t.id) SELECT id, depth FROM t"
  - id: cte_recursive_path
    category: cte
    title: "Recursive CTE building a path string"
    setup:
      - "CREATE TABLE pc_cte_recursive_tree (id INT, mgr INT, name VARCHAR(20)) {{ engine_clause }}"
      - "INSERT INTO pc_cte_recursive_tree VALUES (1, NULL, 'root'), (2, 1, 'a'), (3, 1, 'b'), (4, 2, 'a1'), (5, 4, 'a1x'), (6, 3, 'b1')"
    teardown:
      - "DROP TABLE IF EXISTS pc_cte_recursive_tree"
    sql_mysql: "WITH RECURSIVE t(id, path) AS (SELECT id, CAST(name AS CHAR(200)) FROM pc_cte_recursive_tree WHERE mgr IS NULL UNION ALL SELECT e.id, CONCAT(t.path, '/', e.name) FROM pc_cte_recursive_tree e JOIN t ON e.mgr = t.id) SELECT id, path FROM t"
    sql_postgres: "WITH RECURSIVE t(id, path) AS (SELECT id, CAST(name AS TEXT) FROM pc_cte_recursive_tree WHERE mgr IS NULL UNION ALL SELECT e.id, t.path || '/' || e.name FROM pc_cte_recursive_tree e JOIN t ON e.mgr = t.id) SELECT id, path FROM t"
